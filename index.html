
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairGuard AI - Workshop Management</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-signature-1 { font-family: 'Dancing Script', cursive; }
        .font-signature-2 { font-family: 'Great Vibes', cursive; }
        
        /* PWA Install Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-pwa { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            .printable-area, .printable-area * {
                visibility: visible;
            }
            .printable-area {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                background: white;
                padding: 0;
                margin: 0;
                border: none !important;
                box-shadow: none !important;
                overflow: visible !important;
                max-width: 100% !important;
                max-height: 100% !important;
                border-radius: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            /* Ensure background graphics print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
    
    <script>
        // Use a static Data URI for the manifest to avoid blob protocol restrictions
        const manifest = {
            "name": "RepairGuard AI",
            "short_name": "RepairGuard",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3062/3062430.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestDataUri = 'data:application/json;base64,' + btoa(JSON.stringify(manifest));
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestDataUri;
        document.head.appendChild(link);

        // Note: Dynamic Service Worker registration via Blob URLs is often blocked by 
        // Content Security Policies in preview environments. We rely on the app's 
        // internal IndexedDB logic for offline data persistence.
    </script>
<script type="importmap">

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
